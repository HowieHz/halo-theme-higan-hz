name: Update Toolchain Versions

on:
  schedule:
    # 21:00 UTC = 05:00 Asia/Shanghai on the next day.
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: update-toolchain-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # https://github.com/pnpm/action-setup/releases/tag/v6.1.1
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: 26
          cache: "pnpm"

      - name: Update toolchain versions
        id: update-toolchain
        run: node .github/scripts/update-toolchain-versions.js

      # The updater may raise engines.node above the Node.js version installed above, and
      # pnpm-workspace.yaml sets engineStrict. Regenerate the lockfile on the runtime that the
      # repository now requires instead of the one this job started with.
      - name: Install resolved Node.js
        if: ${{ steps.update-toolchain.outputs.changed == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: ${{ steps.update-toolchain.outputs.node_major }}

      - name: Update Lockfile
        if: ${{ steps.update-toolchain.outputs.changed == 'true' }}
        run: pnpm install --no-frozen-lockfile

      - name: Create Pull Request
        if: ${{ steps.update-toolchain.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # https://github.com/peter-evans/create-pull-request/releases/tag/v8.1.2
        with:
          token: ${{ secrets.PR_WORKFLOW_TOKEN || github.token }}
          commit-message: "chore: update node and pnpm versions"
          title: "chore: update node and pnpm versions"
          body: |
            This PR updates the repository toolchain versions tracked in:
            - `package.json`
            - `.github/actions/**/action.yml`
            - workflows that bootstrap Node.js directly

            Resolved by automation:
            - Node.js major: `${{ steps.update-toolchain.outputs.node_major }}`
            - pnpm version: `${{ steps.update-toolchain.outputs.pnpm_version }}`
          branch: chore/update-toolchain-versions
          delete-branch: true
          labels: dependencies
